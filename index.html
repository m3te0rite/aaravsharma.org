<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Full Screen App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* no scrollbars */
    }
    iframe {
      border: none;          /* borderless */
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://imaarav.base44.app"
    frameborder="0"
    scrolling="no"
  ></iframe>
</body>
</html>
